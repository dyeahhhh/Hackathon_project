services:
  backend:
    build: .
    container_name: outbreak-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./outbreak_frontend:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
